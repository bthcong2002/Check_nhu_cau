name: Keep Streamlit Alive

on:
  schedule:
    - cron: "0 */3 * * *" # Chạy mỗi 3 tiếng, bạn có thể chỉnh lại
  workflow_dispatch:

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Cài đặt Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cài đặt Playwright
        run: |
          # Ưu tiên lấy từ GitHub Secret STREAMLIT_APP_URL, nếu chưa cài thì dùng link mặc định bên dưới
          APP_URL="${SECRET_APP_URL:-https://checknhucau-8yffey6edkxsixc6bxujak.streamlit.app/}"
          echo "Đang ping ứng dụng tại: $APP_URL"
          
          # Sử dụng curl với User-Agent trình duyệt để đánh thức Streamlit Cloud
          STATUS_CODE=$(curl -s -L -o /dev/null -w "%{http_code}" -H "User-Agent: Mozilla/5.0" "$APP_URL" || true)
          echo "HTTP Status Code trả về: $STATUS_CODE"
          
          # Status 200, 302, 303 đều là máy chủ Streamlit đã tiếp nhận và phản hồi thành công (đánh thức app)
          if [ "$STATUS_CODE" -ge 200 ] && [ "$STATUS_CODE" -lt 400 ]; then
            echo "✅ Ứng dụng Streamlit đang phản hồi và được đánh thức thành công!"
          else
            echo "⚠️ Mã phản hồi: $STATUS_CODE (Request vẫn kích hoạt máy chủ Streamlit)"
          fi
